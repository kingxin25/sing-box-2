name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  core:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream sing-box release
        id: upstream
        run: echo "tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout upstream sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Build with V2Ray API
        working-directory: upstream
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -tags with_v2ray_api -trimpath -ldflags="-s -w -buildid=" -o "../sing-box" ./cmd/sing-box
      - name: Build account stats helper
        working-directory: upstream
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p tools/account-stats
          cp ../project/tools/account-stats/main.go tools/account-stats/main.go
          go build -tags with_v2ray_api -trimpath -ldflags="-s -w -buildid=" -o "../account-stats-linux-${{ matrix.arch }}" ./tools/account-stats
      - name: Package core
        run: |
          mkdir -p "dist/sing-box-${{ steps.upstream.outputs.tag }}-linux-${{ matrix.arch }}"
          install -m 755 sing-box "dist/sing-box-${{ steps.upstream.outputs.tag }}-linux-${{ matrix.arch }}/sing-box"
          tar -C dist -czf "sing-box-${{ steps.upstream.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" "sing-box-${{ steps.upstream.outputs.tag }}-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.arch }}
          path: |
            sing-box-*-linux-${{ matrix.arch }}.tar.gz
            account-stats-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout script
        uses: actions/checkout@v4
      - name: Set release version
        run: echo "is_sh_ver=$(grep -h '^is_sh_ver=' ./*.sh | head -n1 | cut -d= -f2)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: dist
          merge-multiple: true
      - name: Package script
        run: tar --exclude='./dist' -czf code.tar.gz ./*
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            code.tar.gz
            dist/*.tar.gz
            dist/account-stats-linux-*
          tag_name: ${{ env.is_sh_ver }}
          body: |
            sing-box core is built from the latest upstream SagerNet/sing-box release with the with_v2ray_api build tag for local account traffic statistics.
